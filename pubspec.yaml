name: github_zip_pusher
description: Personal GitHub repo manager — multi-account, ZIP one-click push, bulk delete.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  archive: ^3.6.1
  file_picker: ^8.1.4
  path: ^1.9.0
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
